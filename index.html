<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Application</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100vh; position: relative; }
        /* Bottom Controls (Coordinates + Locate Me) */
        #bottom-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            align-items: center;
            z-index: 1000;
        }

        /* Individual Elements */
        #coordinate-display { white-space: nowrap; }
        #locate-me {
            background: white;
            border: 1px solid #ccc;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<!-- Coordinate Display & Locate Button Wrapper -->
<div id="bottom-controls">
    <div id="coordinate-display">Lat: -, Lng: - <button onclick="copyCoords()">Copy</button></div>
    <button id="locate-me">📍 Lokasi Saya</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1️⃣ Initialize Map
    var map = L.map('map', { zoomControl: false }).setView([0, 0], 2);

    // 2️⃣ Basemap Layers
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    });

    var googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google'
    });

    osm.addTo(map); // Default basemap

    var baseMaps = {
        "OSM Standard": osm,
        "Google Hybrid": googleHybrid
    };

    // 3️⃣ Overlay Layers (Mock Data)

    // ---- 📌 Administrative Layer (Topmost) ----
    // var adminBoundary = 

    var adminLayer = L.geoJSON(null, {
        style: { color: "red", weight: 2, opacity: 1, fillOpacity: 0, dashArray: "5,5" }
    }).addTo(map);

    // ---- 📌 Fetch Admin Boundary Data from External File ----
    fetch("./src/Administrative Division EPSG4326.geojson") // 🔥 Replace with actual file path
        .then(response => response.json())
        .then(data => {
            console.log("Admin layer Loaded!", data);
            adminLayer.addData(data); // ✅ Add loaded data to the layer

            // ---- 📌 Ensure bounds exist before calling fitBounds ----
            var bounds = adminLayer.getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds.pad(0.2)); // ✅ Only call fitBounds if bounds are valid
                locateUser(); //Calling locate user function
                map.setMaxBounds(bounds.pad(0.2)); // 🔥 Prevents panning outside the boundary
            } else {
                console.warn("Invalid bounds: Administrative layer may be empty.");
        }
        })
        .catch(error => console.error("Error loading Land Use data:", error));

    // ---- 📌 PoI Layer (Icons) ----
    var poiLayer = L.geoJSON({
        "type": "FeatureCollection",
        "features": [
            { "type": "Feature", "properties": { "name": "City School", "type": "school" },
                "geometry": { "type": "Point", "coordinates": [100.5, -0.5] } },
            { "type": "Feature", "properties": { "name": "Tasty Restaurant", "type": "restaurant" },
                "geometry": { "type": "Point", "coordinates": [100.7, -0.6] } },
            { "type": "Feature", "properties": { "name": "Grand Mosque", "type": "mosque" },
                "geometry": { "type": "Point", "coordinates": [100.6, -0.4] } }
        ]
    }, {
        pointToLayer: function (feature, latlng) {
            var icons = {
                "school": "https://cdn-icons-png.flaticon.com/32/2885/2885433.png",
                "restaurant": "https://cdn-icons-png.flaticon.com/32/2921/2921823.png",
                "mosque": "https://cdn-icons-png.flaticon.com/32/1998/1998636.png"
            };
            return L.marker(latlng, {
                icon: L.icon({
                    iconUrl: icons[feature.properties.type] || "https://cdn-icons-png.flaticon.com/32/535/535239.png",
                    iconSize: [24, 24]
                })
            }).bindPopup(`<b>${feature.properties.name}</b>`);
        }
    }).addTo(map);

    // ---- 📌 Road Network Layer ----
    <!-- var roadNetwork = ; -->

    // 5️⃣ Road Styling & Click Info
    function styleRoad(feature) {
        var colors = { "Jalan Tol": "red", "Jalan Arteri Primer": "orange", "Jalan Kolektor Primer": "yellow", "Jalan Lokal Primer": "black" };
        return { color: colors[feature.properties.NAMOBJ] || "grey", weight: 8, opacity: 0.6 };
    }

    var roadLayer = L.geoJSON(null, {
        style: styleRoad,
        onEachFeature: function (feature, layer) {
            layer.bindPopup(`<b>Nama:</b> ${feature.properties.REMARK}`);
        }
    }).addTo(map);

    // ---- 📌 Waterways Layer (Below Roads) ----
    var waterwaysLayer = L.geoJSON(null, {
        style: function (feature) {
            var colors = { "Jaringan Irigasi Primer": "blue", "Jaringan Irigasi Sekunder": "cyan", "Irrigation": "lightblue" };
            return { color: colors[feature.properties.NAMOBJ] || "gray", weight: 8, opacity: 0.6 };
        },
        onEachFeature: function (feature, layer) {
            layer.bindPopup(`<b>Daerah Irigasi:</b> ${feature.properties.REMARK}`);
        }
    });

    // ---- 📌 Landuse Layer (Fixed Popups) ----
    var landuseLayer = L.geoJSON(null, {
        style: function (feature) {
            var colors = { "Badan Air": "#97dbf2",
                            "Kawasan Ekosistem Mangrove": "#2d966e",
                            "Kawasan Hortikultura": "#e6ff4b",
                            "Kawasan Hutan Lindung": "#325f28",
                            "Kawasan Hutan Produksi Tetap": "#69b437",
                            "Kawasan Pariwisata": "#ffa5ff",
                            "Kawasan Pembangkit Tenaga Listrik": "#00ffcd",
                            "Kawasan Perikanan Budidaya": "#82b9d2",
                            "Kawasan Perkebunan": "#afaf37",
                            "Kawasan Perkebunan Rakyat": "#9bdc9b",
                            "Kawasan Permukiman Perdesaan": "#eb9b3c",
                            "Kawasan Permukiman Perkotaan": "#f59b1e",
                            "Kawasan Pertahanan dan Keamanan": "#9b00ff",
                            "Kawasan Peruntukan Industri": "#690000",
                            "Kawasan Tanaman Pangan": "#c8f546",
                            "Kawasan Transportasi": "#d73700",
                            "Suaka Margasatwa": "#6e6ee1",
                            "Taman Nasional": "#9b87ff",
                            "Farm": "brown" };
            return { color: colors[feature.properties.NAMOBJ] || "gray", weight: 1, fillOpacity: 0.5 };
        },
            onEachFeature: function (feature, layer) {
            // Debugging: Check if properties exist
            // console.log("Feature properties:", feature.properties);
            
            if (feature.properties && feature.properties.NAMOBJ) {
                layer.bindPopup(`<b>Land Use:</b> ${feature.properties.NAMOBJ}`);
            } else {
                layer.bindPopup("Unknown Land Use");
            }
        }
    });

    var overlayMaps = {
        "Batas Administrasi": adminLayer,
        // "Points of Interest (PoI)": poiLayer,
        "Jaringan Jalan": roadLayer,
        "Jaringan SDA": waterwaysLayer,
        "Pola Ruang": landuseLayer
    };

    // 6️⃣ Add Layer Control to Map
    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

    // 7️⃣ Locate User
    document.getElementById('locate-me').onclick = function () {
        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
    };

    var userMarker;
    map.on('locationfound', function (e) {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker(e.latlng).addTo(map);
        L.circle(e.latlng, { radius: e.accuracy, color: 'blue', fillOpacity: 0.2 }).addTo(map);
    });

    // 8️⃣ Tap to Pin & Show Coordinates
    var tapMarker;
    map.on('click', function (e) {
        if (tapMarker) map.removeLayer(tapMarker);
        tapMarker = L.marker(e.latlng).addTo(map);
        document.getElementById('coordinate-display').innerHTML =
            `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}
            <button onclick="copyCoords()">Copy</button>`;
    });

    // 9️⃣ Copy to Clipboard
    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordinate-display').innerText.split("Copy")[0].trim());
        alert("Coordinates copied!");
    }

    // ---- LOCATE USER LOCATION ON FIRST LOAD ----
    function locateUser() {

        // ---- 📌 Default Fallback Location ----
        var fallbackCoords = [-7.706054, 114.005217]; 
        var fallbackZoom = 20; // Adjust zoom level as needed

        // ---- 📌 Try to Locate User ----
        map.locate({ setView: true, maxZoom: 20, timeout: 5000 }); // 5s timeout

        // ---- 📌 Handle Location Found ----
        map.on("locationfound", function(e) {
            L.marker(e.latlng).addTo(map) // Add marker on user's location
                .bindPopup("You are here").openPopup();
            // console.log("User Location Found!");
        });

        // ---- 📌 Handle Location Error (Use Default) ----
        map.on("locationerror", function() {
            map.setView(fallbackCoords, fallbackZoom); // Move to default location
            // console.log("User Location NOT Found!");
        });
    }

    // ---- FETCH NECESSARY DATA DATA ----

    // ---- Fetch road network Data from External File ----
    fetch("./src/Road Network EPSG4326.geojson") // 🔥 Replace with actual file path
        .then(response => response.json())
        .then(data => {
            console.log("Waterways Data Loaded!", data);
            roadLayer.addData(data); // ✅ Add loaded data to the layer
        })
        .catch(error => console.error("Error loading Land Use data:", error));

    // ---- Fetch waterways Data from External File ----
    fetch("./src/Waterways EPSG4326.geojson") // 🔥 Replace with actual file path
        .then(response => response.json())
        .then(data => {
            console.log("Waterways Data Loaded!", data);
            waterwaysLayer.addData(data); // ✅ Add loaded data to the layer
        })
        .catch(error => console.error("Error loading Land Use data:", error));

    // ---- Fetch Land Use Data from External File ----
    fetch("./src/landuse4326.geojson") // 🔥 Replace with actual file path
        .then(response => response.json())
        .then(data => {
            console.log("Land Use Data Loaded!", data);
            landuseLayer.addData(data); // ✅ Add loaded data to the layer
        })
        .catch(error => console.error("Error loading Land Use data:", error));

</script>

</body>
</html>
