<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Application</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100vh; position: relative; }
        /* Bottom Controls (Coordinates + Locate Me) */
        #bottom-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            align-items: center;
            z-index: 1000;
        }

        /* Individual Elements */
        #coordinate-display { white-space: nowrap; }
        #locate-me {
            background: white;
            border: 1px solid #ccc;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<!-- Coordinate Display & Locate Button Wrapper -->
<div id="bottom-controls">
    <div id="coordinate-display">Lat: -, Lng: - <button onclick="copyCoords()">Copy</button></div>
    <button id="locate-me">📍 Locate Me</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1️⃣ Initialize Map
    var map = L.map('map', { zoomControl: false }).setView([0, 0], 2);

    // 2️⃣ Basemap Layers
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    });

    var googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google'
    });

    osm.addTo(map); // Default basemap

    var baseMaps = {
        "OSM Standard": osm,
        "Google Hybrid": googleHybrid
    };

    // 3️⃣ Overlay Layers (Mock Data)

    // ---- 📌 Administrative Layer (Topmost) ----
    var adminBoundary = {
        "type": "FeatureCollection",
        "features": [
            {
                "type": "Feature",
                "properties": { "name": "Admin Area" },
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[[100, -1], [101, -1], [101, 0], [100, 0], [100, -1]]]
                }
            }
        ]
    };

    // ---- 📌 PoI Layer (Icons) ----
    var poiLayer = L.geoJSON({
        "type": "FeatureCollection",
        "features": [
            { "type": "Feature", "properties": { "name": "City School", "type": "school" },
                "geometry": { "type": "Point", "coordinates": [100.5, -0.5] } },
            { "type": "Feature", "properties": { "name": "Tasty Restaurant", "type": "restaurant" },
                "geometry": { "type": "Point", "coordinates": [100.7, -0.6] } },
            { "type": "Feature", "properties": { "name": "Grand Mosque", "type": "mosque" },
                "geometry": { "type": "Point", "coordinates": [100.6, -0.4] } }
        ]
    }, {
        pointToLayer: function (feature, latlng) {
            var icons = {
                "school": "https://cdn-icons-png.flaticon.com/32/2885/2885433.png",
                "restaurant": "https://cdn-icons-png.flaticon.com/32/2921/2921823.png",
                "mosque": "https://cdn-icons-png.flaticon.com/32/1998/1998636.png"
            };
            return L.marker(latlng, {
                icon: L.icon({
                    iconUrl: icons[feature.properties.type] || "https://cdn-icons-png.flaticon.com/32/535/535239.png",
                    iconSize: [24, 24]
                })
            }).bindPopup(`<b>${feature.properties.name}</b>`);
        }
    }).addTo(map);

    // ---- 📌 Road Network Layer ----
    var roadNetwork = {
        "type": "FeatureCollection",
        "features": [
            { "type": "Feature", "properties": { "road_type": "Toll", "name": "Highway 1", "condition": "Good" },
                "geometry": { "type": "LineString", "coordinates": [[100, -0.5], [101, -0.5]] } },
            { "type": "Feature", "properties": { "road_type": "Main Road", "name": "Main Street", "condition": "Moderate" },
                "geometry": { "type": "LineString", "coordinates": [[100, -0.3], [101, -0.3]] } }
        ]
    };

    // ---- 📌 Waterways Layer (Below Roads) ----
    var waterwaysLayer = L.geoJSON({
        "type": "FeatureCollection",
        "features": [
            { "type": "Feature", "properties": { "type": "River" },
                "geometry": { "type": "LineString", "coordinates": [[100.2, -0.2], [101.2, -0.2]] } }
        ]
    }, {
        style: function (feature) {
            var colors = { "River": "blue", "Canal": "cyan", "Irrigation": "lightblue" };
            return { color: colors[feature.properties.type] || "gray", weight: 3 };
        },
        onEachFeature: function (feature, layer) {
            layer.bindPopup(`<b>Type:</b> ${feature.properties.type}`);
        }
    });

    // ---- 📌 Landuse Layer (Fixed Popups) ----
    var landuseLayer = L.geoJSON({
        "type": "FeatureCollection",
        "features": [
            { "type": "Feature", "properties": { "use": "Residential" },
                "geometry": { "type": "Polygon", "coordinates": [[[100.1, -0.6], [100.3, -0.6], [100.3, -0.4], [100.1, -0.4], [100.1, -0.6]]] } },
            { "type": "Feature", "properties": { "use": "Commercial" },
                "geometry": { "type": "Polygon", "coordinates": [[[100.4, -0.6], [100.6, -0.6], [100.6, -0.4], [100.4, -0.4], [100.4, -0.6]]] } }
        ]
    }, {
        style: function (feature) {
            var colors = { "Residential": "green", "Commercial": "yellow", "Industrial": "red", "Farm": "brown" };
            return { color: colors[feature.properties.use] || "gray", weight: 1, fillOpacity: 0.5 };
        },
        onEachFeature: function (feature, layer) {
            // Debugging: Check if properties exist
            console.log("Feature properties:", feature.properties);
            
            if (feature.properties && feature.properties.use) {
                layer.bindPopup(`<b>Land Use:</b> ${feature.properties.use}`);
            } else {
                layer.bindPopup("Unknown Land Use");
            }
        }
    });

    // Test if it's correctly added
    console.log("Landuse Layer Added:", landuseLayer);

    // 4️⃣ Add Admin Boundary
    var adminLayer = L.geoJSON(adminBoundary, {
        style: { color: "red", weight: 2, opacity: 1, fillOpacity: 0, dashArray: "5,5" }
    }).addTo(map);

    // Center & Bound View
    var bounds = adminLayer.getBounds();
    map.fitBounds(bounds.pad(0.2));

    // 5️⃣ Road Styling & Click Info
    function styleRoad(feature) {
        var colors = { "Toll": "purple", "Main Road": "blue", "Collector": "orange", "Neighbourhood Road": "gray" };
        return { color: colors[feature.properties.road_type] || "black", weight: 8, opacity: 0.6 };
    }

    var roadLayer = L.geoJSON(roadNetwork, {
        style: styleRoad,
        onEachFeature: function (feature, layer) {
            layer.on('click', function () {
                L.popup()
                    .setLatLng(layer.getBounds().getCenter())
                    .setContent("<b>" + feature.properties.name + "</b><br>Condition: " + feature.properties.condition)
                    .openOn(map);
            });
        }
    }).addTo(map);

    var overlayMaps = {
        "Administrative Layer": adminLayer,
        "Points of Interest (PoI)": poiLayer,
        "Road Network": roadLayer,
        "Waterways": waterwaysLayer,
        "Land Use": landuseLayer
    };

    // 6️⃣ Add Layer Control to Map
    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

    // 7️⃣ Locate User
    document.getElementById('locate-me').onclick = function () {
        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
    };

    var userMarker;
    map.on('locationfound', function (e) {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker(e.latlng).addTo(map);
        L.circle(e.latlng, { radius: e.accuracy, color: 'blue', fillOpacity: 0.2 }).addTo(map);
    });

    // 8️⃣ Tap to Pin & Show Coordinates
    var tapMarker;
    map.on('click', function (e) {
        if (tapMarker) map.removeLayer(tapMarker);
        tapMarker = L.marker(e.latlng).addTo(map);
        document.getElementById('coordinate-display').innerHTML =
            `Lat: ${e.latlng.lat.toFixed(6)}, Lng: ${e.latlng.lng.toFixed(6)}
            <button onclick="copyCoords()">Copy</button>`;
    });

    // 9️⃣ Copy to Clipboard
    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordinate-display').innerText.split("Copy")[0].trim());
        alert("Coordinates copied!");
    }

</script>

</body>
</html>
