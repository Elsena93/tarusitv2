<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile WebGIS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
        
        .leaflet-popup-content button {
            padding: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map with default view
        var map = L.map('map').setView([51.505, -0.09], 13);

        // Base layers
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Administrative Layer (Sample GeoJSON)
        var adminLayer = L.geoJSON({
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "properties": {},
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[
                        [51.49, -0.12],
                        [51.51, -0.12],
                        [51.51, -0.06],
                        [51.49, -0.06],
                        [51.49, -0.12]
                    ]]
                }
            }]
        }, {
            style: {
                color: "#ff0000",
                weight: 2,
                dashArray: '5,5',
                fillOpacity: 0
            }
        }).addTo(map);

        // Road Layer (Sample GeoJSON)
        var roadLayer = L.geoJSON({
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "properties": {
                    "type": "main",
                    "name": "Main Street"
                },
                "geometry": {
                    "type": "LineString",
                    "coordinates": [
                        [51.50, -0.10],
                        [51.50, -0.08]
                    ]
                }
            }]
        }, {
            style: function(feature) {
                return {
                    color: {
                        toll: '#ff0000',
                        main: '#ffa500',
                        collector: '#ffff00',
                        neighborhood: '#ffffff'
                    }[feature.properties.type] || '#cccccc',
                    weight: {
                        toll: 4,
                        main: 3,
                        collector: 2,
                        neighborhood: 1
                    }[feature.properties.type] || 1
                }
            },
            onEachFeature: function(feature, layer) {
                if (feature.properties) {
                    layer.on('click', function(e) {
                        L.popup()
                            .setLatLng(e.latlng)
                            .setContent(`
                                Road Info:<br>
                                Name: ${feature.properties.name || 'N/A'}<br>
                                Type: ${feature.properties.type || 'Unknown'}
                            `)
                            .openOn(map);
                    });
                }
            }
        }).addTo(map);

        // Set bounds with padding
        map.fitBounds(adminLayer.getBounds().pad(0.2));

        // Location button
        var locateControl = L.control({
            position: 'topleft'
        });
        locateControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
            div.innerHTML = '<a href="#" role="button" title="Locate me">📍</a>';
            div.onclick = function() {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    map.flyTo([pos.coords.latitude, pos.coords.longitude], 16);
                    L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map)
                        .bindPopup("You are here!").openPopup();
                });
                return false;
            };
            return div;
        };
        locateControl.addTo(map);

        // Click handling
        var clickMarker;
        map.on('click', function(e) {
            if(clickMarker) map.removeLayer(clickMarker);
            
            clickMarker = L.marker(e.latlng, {
                draggable: true
            }).addTo(map)
            .bindPopup(`
                Coordinates: <br>
                ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}<br>
                <button onclick="copyCoords('${e.latlng}')">Copy</button>
            `).openPopup();
        });

        function copyCoords(text) {
            navigator.clipboard.writeText(text)
                .catch(err => alert('Copy failed: ' + err));
        }
    </script>
</body>
</html>
