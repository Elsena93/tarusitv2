<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Improved Mobile WebGIS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
        
        .coord-display {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: white;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="coord-display" id="coordDisplay">
        <span id="coordinates">Click map to show coordinates</span>
        <button onclick="copyCoords()" style="margin-left: 8px;">Copy</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map
        var map = L.map('map').setView([51.505, -0.09], 13);
        var clickMarker;

        // Base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Administrative Layer
        var adminLayer = L.geoJSON({
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "properties": {},
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[
                        [51.49, -0.12],
                        [51.51, -0.12],
                        [51.51, -0.06],
                        [51.49, -0.06],
                        [51.49, -0.12]
                    ]]
                }
            }]
        }, {
            style: {
                color: "#ff0000",
                weight: 2,
                dashArray: '5,5',
                fillOpacity: 0
            }
        }).addTo(map);

        // Set map bounds with 20% padding
        var adminBounds = adminLayer.getBounds();
        map.setMaxBounds(adminBounds.pad(0.2));

        // Road Layer with Length Calculation
        var roadLayer = L.geoJSON({
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "properties": {
                    "type": "main",
                    "name": "Main Street",
                    "condition": "Good"
                },
                "geometry": {
                    "type": "LineString",
                    "coordinates": [
                        [51.50, -0.10],
                        [51.50, -0.08]
                    ]
                }
            }]
        }, {
            style: function(feature) {
                return {
                    color: {
                        toll: '#ff0000',
                        main: '#ffa500',
                        collector: '#ffff00',
                        neighborhood: '#ffffff'
                    }[feature.properties.type] || '#cccccc',
                    weight: {
                        toll: 4,
                        main: 3,
                        collector: 2,
                        neighborhood: 1
                    }[feature.properties.type] || 1
                }
            },
            onEachFeature: function(feature, layer) {
                if (feature.properties) {
                    // Calculate road length
                    const length = layer.getLatLngs().reduce((total, point, index, points) => {
                        return index > 0 ? 
                            total + points[index-1].distanceTo(points[index]) 
                            : total;
                    }, 0);
                    
                    layer.on('click', function(e) {
                        L.popup()
                            .setLatLng(e.latlng)
                            .setContent(`
                                <b>${feature.properties.name}</b><br>
                                Type: ${feature.properties.type}<br>
                                Condition: ${feature.properties.condition}<br>
                                Length: ${(length/1000).toFixed(2)} km
                            `)
                            .openOn(map);
                    });
                }
            }
        }).addTo(map);

        // Location Control
        const locateControl = L.control({position: 'topleft'});
        locateControl.onAdd = () => {
            const div = L.DomUtil.create('div', 'leaflet-control-locate');
            div.innerHTML = '<button style="padding:6px;">📍</button>';
            div.onclick = () => {
                navigator.geolocation.getCurrentPosition(pos => {
                    map.flyTo([pos.coords.latitude, pos.coords.longitude], 16);
                });
            };
            return div;
        };
        locateControl.addTo(map);

        // Click Handling with Coordinates Display
        map.on('click', e => {
            if(clickMarker) map.removeLayer(clickMarker);
            clickMarker = L.marker(e.latlng).addTo(map);
            
            const coordText = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            document.getElementById('coordinates').textContent = coordText;
        });

        // Copy Functionality
        function copyCoords() {
            const text = document.getElementById('coordinates').textContent;
            navigator.clipboard.writeText(text)
                .then(() => alert('Coordinates copied!'))
                .catch(err => alert('Copy failed: ' + err));
        }
    </script>
</body>
</html>
